<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Include Marked.js for rendering Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Force body and html to fill the entire embedded frame without scrollbars */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      overflow: hidden;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    /* Make container span 100% width and height of the window */
    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: white;
    }

    #messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Markdown Styling Inside Chat Bubbles */
    .msg p {
      margin: 0 0 8px 0;
    }
    .msg p:last-child {
      margin-bottom: 0;
    }
    .msg pre {
      background: #272822;
      color: #f8f8f2;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
    .msg code {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .msg ul, .msg ol {
      margin: 4px 0;
      padding-left: 20px;
    }

    .user {
      align-self: flex-end;
      background: #007bff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: #e9ecef;
      color: #333;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 8px;
      background: #fff;
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    #send-btn {
      margin-left: 8px;
      padding: 10px 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #send-btn:disabled {
      background: #ccc;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="messages">
    <div class="msg bot">Hello! Ask me anything!.</div>
  </div>
  <div id="input-area">
    <input type="text" id="user-input" placeholder="Type a message..." />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const messagesContainer = document.getElementById('messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  // Memory store to keep track of the entire conversation history
  const conversationHistory = [
    { role: "system", content: "You are a helpful, knowledgeable, and friendly assistant designed to answer questions across a variety of subjects, including Science, History, Math, Literature, and General Knowledge." }
  ];

  // Allow pressing Enter to send
  userInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // 1. Display user message in UI
    addMessage(text, 'user');

    // 2. Add user message to conversation memory
    conversationHistory.push({ role: "user", content: text });

    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    // Show loading state
    const loadingDiv = addMessage("Thinking...", 'bot');

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbyr4l7vVjCx4HD3IwsqJCa_DBrk9mR4mne_JskBESEwEJNZyc7JGP4jZM9PCddBCZ8oNQ/exec", {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8" // Allows Google Apps Script to accept the request body as plain text
        },
        body: JSON.stringify({
          messages: conversationHistory
        })
      });

      const data = await response.json();
      
      if (data.choices && data.choices.length > 0) {
        const botReply = data.choices[0].message.content;
        
        // Render Markdown into HTML
        loadingDiv.innerHTML = marked.parse(botReply);

        // 4. Save bot's response into memory for future context
        conversationHistory.push({ role: "assistant", content: botReply });
      } else {
        loadingDiv.textContent = "Error: Invalid response, try again later.";
        conversationHistory.pop();
      }
    } catch (error) {
      console.error(error);
      loadingDiv.textContent = "Error connecting, try again later.";
      conversationHistory.pop();
    } finally {
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('msg', sender);
    if (sender === 'bot' && typeof marked !== 'undefined') {
      msgDiv.innerHTML = marked.parse(text);
    } else {
      msgDiv.textContent = text;
    }

    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return msgDiv;
  }
</script>
</body>
</html>
