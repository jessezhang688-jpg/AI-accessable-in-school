<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 1. Include Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- 2. Include KaTeX CSS and JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  
  <!-- 3. Include KaTeX Auto-Render Extension -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* Smooth transition animation for theme switching */
    body, #chat-container, #header-bar, #input-area, #user-input, .msg {
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    /* Force body and html to fill the entire embedded frame without scrollbars */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: var(--chat-bg);
    }

    #messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Markdown Styling Inside Chat Bubbles */
    .msg p {
      margin: 0 0 8px 0;
    }
    .msg p:last-child {
      margin-bottom: 0;
    }
    .msg pre {
      background: #272822;
      color: #f8f8f2;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
    .msg code {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .msg ul, .msg ol {
      margin: 4px 0;
      padding-left: 20px;
    }
    .msg table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
    }
    .msg th, .msg td {
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      font-size: 13px;
    }
    .msg th {
      background: rgba(0, 0, 0, 0.05);
    }

    .user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
    }

    .bot {
      align-self: flex-start;
      background: var(--bot-bg);
      color: var(--bot-text);
    }

    #input-area {
      display: flex;
      border-top: 1px solid var(--border-color);
      padding: 8px;
      background: var(--chat-bg);
    }

    /* Unified input container */
    #input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 4px;
      overflow: hidden;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    #attach-btn {
      padding: 0 12px;
      background: transparent;
      color: var(--text-color);
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.4s ease;
    }

    #attach-btn:hover {
      background: rgba(128, 128, 128, 0.15);
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 14px;
      color: var(--text-color);
      outline: none;
    }

    #send-btn {
      margin-left: 8px;
      padding: 10px 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #send-btn:disabled {
      background: #ccc;
    }

    #save-btn {
      margin-left: 6px;
      padding: 10px 14px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    #save-btn:hover {
      background: #218838;
    }

    /* Loading Spinner Animation */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.15);
      border-top-color: #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Flowing background entrance animation for message elements */
    @keyframes flowIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .flow-block {
      animation: flowIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Theme Variables */
    :root {
      --bg-color: #f4f4f9;
      --chat-bg: #ffffff;
      --text-color: #333333;
      --bot-bg: #e9ecef;
      --bot-text: #333333;
      --user-bg: #007bff;
      --user-text: #ffffff;
      --input-bg: #ffffff;
      --input-border: #cccccc;
      --border-color: #cccccc;
    }

    [data-theme="dark"] {
      --bg-color: #1e1e1e;
      --chat-bg: #2c2c2c;
      --text-color: #f4f4f4;
      --bot-bg: #3a3a3a;
      --bot-text: #f4f4f4;
      --user-bg: #0056b3;
      --user-text: #ffffff;
      --input-bg: #2c2c2c;
      --input-border: #555555;
      --border-color: #555555;
    }

    #header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      font-size: 15px;
    }

    .theme-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #007bff;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .theme-label-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    .theme-text {
      position: relative;
      width: 80px;
      text-align: right;
      transition: opacity 0.3s ease, transform 0.3s ease;
      display: inline-block;
    }

    /* Slide-up pop-up animation for file badge */
    @keyframes badgeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #file-badge-container {
      padding: 0 12px 6px 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .file-preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 123, 255, 0.15);
      color: var(--text-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      animation: badgeSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .file-preview-badge button {
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      padding: 0;
      line-height: 1;
    }

    .file-preview-badge button:hover {
      color: #ff4d4d;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="header-bar">
    <span>AI Chat</span>
    <div class="theme-label-container">
      <span id="theme-label" class="theme-text">Light Mode</span>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <div id="messages">
    <div class="msg bot flow-block">Hello! Ask me anything!</div>
  </div>

  <div id="file-badge-container"></div>

  <div id="input-area">
    <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)" />
    
    <div id="input-wrapper">
      <button id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach File">+</button>
      <input type="text" id="user-input" placeholder="Type a message or attach a file..." />
    </div>

    <button id="send-btn" onclick="sendMessage()">Send</button>
    <button id="save-btn" onclick="saveChatHistory()" title="Save Chat History">💾 Save</button>
  </div>
</div>

<script>
  const messagesContainer = document.getElementById('messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  let attachedFileContent = null;
  let attachedFileName = null;

  const conversationHistory = [
    { role: "system", content: "You are a helpful, knowledgeable, and friendly assistant. Always structure your responses using rich Markdown formatting: use bold headers (###), bullet points, markdown tables for lists/timelines, and horizontal rules (---) to separate sections. When writing mathematical expressions or fractions, always use single dollar signs for inline math (e.g. $\\frac{a}{b}$) and double dollar signs for block math." }
  ];

  function parseMessageWithMath(text) {
    const mathBlocks = [];
    let protectedText = text.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$|\\\[[\s\S]*?\\\]|\[[^\]\n]+?\])/g, (match) => {
      mathBlocks.push(match);
      return `@@MATH_${mathBlocks.length - 1}@@`;
    });

    let parsedHTML = typeof marked !== 'undefined' ? marked.parse(protectedText) : protectedText;

    mathBlocks.forEach((math, index) => {
      parsedHTML = parsedHTML.replace(`@@MATH_${index}@@`, math);
    });

    return parsedHTML;
  }

  // Flow-in effect with live KaTeX rendering per chunk (supporting both $ and [] delimiters)
  function flowInEffect(element, htmlContent) {
    element.innerHTML = "";
    
    const rawParagraphs = htmlContent.split(/\n\n+/).filter(p => p.trim() !== '');
    
    if (rawParagraphs.length === 0) {
      element.innerHTML = parseMessageWithMath(htmlContent);
      return;
    }

    rawParagraphs.forEach((paraText, index) => {
      setTimeout(() => {
        const parsedParaHTML = parseMessageWithMath(paraText);
        
        const blockDiv = document.createElement('div');
        blockDiv.className = 'flow-block';
        blockDiv.innerHTML = parsedParaHTML;
        blockDiv.style.marginBottom = '8px';
        
        element.appendChild(blockDiv);

        if (typeof renderMathInElement !== 'undefined') {
          renderMathInElement(blockDiv, {
            delimiters: [
              {left: "$$", right: "$$", display: true},
              {left: "$", right: "$", display: false},
              {left: "\\[", right: "\\]", display: true},
              {left: "[", right: "]", display: false}
            ],
            throwOnError: false
          });
        }

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, index * 90);
    });
  }

  function updateThemeUI(isDark, animate = true) {
    const label = document.getElementById('theme-label');
    
    if (animate) {
      label.style.opacity = '0';
      label.style.transform = 'translateY(-4px)';
    }

    setTimeout(() => {
      label.textContent = isDark ? 'Dark Mode' : 'Light Mode';
      if (animate) {
        label.style.opacity = '1';
        label.style.transform = 'translateY(0)';
      }
    }, animate ? 150 : 0);
  }

  function toggleTheme() {
    const isDark = document.getElementById('theme-toggle').checked;
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');
    }
    updateThemeUI(isDark, true);
  }

  function saveChatHistory() {
    const chatLog = conversationHistory
      .filter(msg => msg.role !== 'system')
      .map(msg => `${msg.role === 'user' ? 'You' : 'AI'}: ${msg.content}`)
      .join('\n\n------------------------------------\n\n');

    if (!chatLog) {
      alert("No chat history to save yet!");
      return;
    }

    const blob = new Blob([chatLog], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    
    link.href = url;
    link.download = `chat-history-${new Date().toISOString().slice(0, 10)}.txt`;
    document.body.appendChild(link);
    link.click();
    
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('theme-toggle').checked = true;
      updateThemeUI(true, false);
    } else {
      updateThemeUI(false, false);
    }
  });

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      const link = document.createElement('a');
      link.href = 'https://classroom.google.com';
      link.target = '_top';
      document.body.appendChild(link);
      link.click();
      
      setTimeout(function() {
        window.location.href = 'https://classroom.google.com';
      }, 100);
    }
  });

  userInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      attachedFileContent = e.target.result;
      attachedFileName = file.name;
      
      const badgeContainer = document.getElementById('file-badge-container');
      badgeContainer.innerHTML = `
        <div class="file-preview-badge">
          <span>📎 ${file.name}</span>
          <button onclick="removeAttachedFile()" title="Remove file">&times;</button>
        </div>
      `;
      userInput.focus();
    };
    reader.readAsText(file);
  }

  function removeAttachedFile() {
    attachedFileContent = null;
    attachedFileName = null;
    document.getElementById('file-input').value = '';
    document.getElementById('file-badge-container').innerHTML = '';
    userInput.focus();
  }

  async function sendMessage() {
    let text = userInput.value.trim();

    // Attach file content if present before clearing variables
    if (attachedFileContent && attachedFileName) {
      text = `${text ? text + '\n\n' : ''}[Attached File: ${attachedFileName}]\n\`\`\`\n${attachedFileContent}\n\`\`\``;
    }

    if (!text) return;

    // Display user message in chat
    const displayMessage = userInput.value.trim() + (attachedFileName ? ` (Attached: ${attachedFileName})` : '');
    addMessage(displayMessage, 'user');
    
    conversationHistory.push({ role: "user", content: text });

    // Reset attachment state
    attachedFileContent = null;
    attachedFileName = null;
    document.getElementById('file-input').value = '';
    document.getElementById('file-badge-container').innerHTML = '';

    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    const loadingDiv = addMessage('<span class="spinner"></span>Thinking...', 'bot');

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbwD8gl-qLpvmU5Y_FPPRlgTaIKGX5PEyLY-veIlM__ceGFKeJF3aGQsFOuiExA5gA/exec", {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          messages: conversationHistory
        })
      });

      const data = await response.json();
      
      if (data.choices && data.choices.length > 0) {
        const botReply = data.choices[0].message.content;
        flowInEffect(loadingDiv, botReply);
        conversationHistory.push({ role: "assistant", content: botReply });
      } else {
        loadingDiv.textContent = "Error: Invalid response, try again later.";
        conversationHistory.pop();
      }
    } catch (error) {
      console.error(error);
      loadingDiv.textContent = "Error connecting, try again later.";
      conversationHistory.pop();
    } finally {
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('msg', sender, 'flow-block');
    
    if (sender === 'bot') {
      msgDiv.innerHTML = parseMessageWithMath(text);
      if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(msgDiv, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false},
            {left: "\\[", right: "\\]", display: true},
            {left: "[", right: "]", display: false}
          ],
          throwOnError: false
        });
      }
    } else {
      msgDiv.textContent = text;
    }

    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return msgDiv;
  }
</script>

</body>
</html>
