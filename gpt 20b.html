<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 1. Include Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- 2. Include KaTeX CSS and JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  
  <!-- 3. Include KaTeX Auto-Render Extension -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

 
  <style>
    /* Force body and html to fill the entire embedded frame without scrollbars */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      overflow: hidden;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: white;
    }

    #messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Markdown Styling Inside Chat Bubbles */
    .msg p {
      margin: 0 0 8px 0;
    }
    .msg p:last-child {
      margin-bottom: 0;
    }
    .msg pre {
      background: #272822;
      color: #f8f8f2;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
    .msg code {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .msg ul, .msg ol {
      margin: 4px 0;
      padding-left: 20px;
    }

    .user {
      align-self: flex-end;
      background: #007bff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: #e9ecef;
      color: #333;
    }

    #input-area {
      display: flex;
      border-top: 1px solid #ccc;
      padding: 8px;
      background: #fff;
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    #send-btn {
      margin-left: 8px;
      padding: 10px 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #send-btn:disabled {
      background: #ccc;
    }
    /*loading spinner*/
    .spinner{
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.15);
      border-top-color: #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="messages">
    <div class="msg bot">Hello! Ask me anything!</div>
  </div>
  <div id="input-area">
    <input type="text" id="user-input" placeholder="Type a message..." />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const messagesContainer = document.getElementById('messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  const conversationHistory = [
    { role: "system", content: "You are a helpful, knowledgeable, and friendly assistant designed to answer questions across a variety of subjects, including Science, History, Math, Literature, and General Knowledge. When writing mathematical expressions or fractions, always use single dollar signs for inline math (e.g. $\\frac{a}{b}$) and double dollar signs for block math." }
  ];

  // Helper function using safe @@ symbols to protect math from Marked.js
  function parseMessageWithMath(text) {
    const mathBlocks = [];
    let protectedText = text.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
      mathBlocks.push(match);
      return `@@MATH_${mathBlocks.length - 1}@@`;
    });

    let parsedHTML = typeof marked !== 'undefined' ? marked.parse(protectedText) : protectedText;

    mathBlocks.forEach((math, index) => {
      parsedHTML = parsedHTML.replace(`@@MATH_${index}@@`, math);
    });

    return parsedHTML;
  }

  // Stealth Panic Key (Esc) for Embedded Google Sites
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      const link = document.createElement('a');
      link.href = 'https://classroom.google.com';
      link.target = '_top';
      document.body.appendChild(link);
      link.click();
      
      setTimeout(function() {
        window.location.href = 'https://classroom.google.com';
      }, 100);
    }
  });

  userInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    conversationHistory.push({ role: "user", content: text });

    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    const loadingDiv = addMessage('<span class="spinner"></span>Thinking...', 'bot');

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbwD8gl-qLpvmU5Y_FPPRlgTaIKGX5PEyLY-veIlM__ceGFKeJF3aGQsFOuiExA5gA/exec", {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          messages: conversationHistory
        })
      });

      const data = await response.json();
      
      if (data.choices && data.choices.length > 0) {
        const botReply = data.choices[0].message.content;
        
        loadingDiv.innerHTML = parseMessageWithMath(botReply);
        
        renderMathInElement(loadingDiv, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ],
          throwOnError: false
        });

        // Correctly inside the scope block
        conversationHistory.push({ role: "assistant", content: botReply });
      } else {
        loadingDiv.textContent = "Error: Invalid response, try again later.";
        conversationHistory.pop();
      }
    } catch (error) {
      console.error(error);
      loadingDiv.textContent = "Error connecting, try again later.";
      conversationHistory.pop();
    } finally {
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('msg', sender);
    
    if (sender === 'bot') {
      msgDiv.innerHTML = parseMessageWithMath(text);
      if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(msgDiv, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ],
          throwOnError: false
        });
      }
    } else {
      msgDiv.textContent = text;
    }

    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return msgDiv;
  }
</script>

</body>
</html>
