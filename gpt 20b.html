<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chat Widget</title>
  <!-- 1. Include Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- 2. Include KaTeX CSS and JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <style>
    /* Smooth transition animation for theme switching */
    body, #chat-container, #header-bar, #input-area, #user-input, .msg {
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    /* Force body and html to fill the entire embedded frame without scrollbars */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: var(--chat-bg);
      position: relative;
    }

    #scroll-bottom-btn {
      position: absolute;
      right: 20px;
      bottom: 75px;
      background: var(--user-bg);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s, transform 0.2s;
      z-index: 100;
    }

    #scroll-bottom-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    #scroll-bottom-btn:hover {
      transform: scale(1.1);
    }

    #messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Markdown Styling Inside Chat Bubbles */
    .msg p {
      margin: 0 0 8px 0;
    }

    .msg p:last-child {
      margin-bottom: 0;
    }

    .msg pre {
      background: #272822;
      color: #f8f8f2;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
    .msg code {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .msg ul, .msg ol {
      margin: 4px 0;
      padding-left: 20px;
    }
    .msg table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
    }
    .msg th, .msg td {
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      font-size: 13px;
    }
    .msg th {
      background: rgba(0, 0, 0, 0.05);
    }

    .user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
    }

    .bot {
      align-self: flex-start;
      background: var(--bot-bg);
      color: var(--bot-text);
    }

    #input-area {
      display: flex;
      border-top: 1px solid var(--border-color);
      padding: 8px;
      background: var(--chat-bg);
    }

    /* Unified input container */
    #input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 4px;
      overflow: hidden;
      transition: background-color 0.4s ease, border-color 0.4s ease;
    }

    #attach-btn {
      padding: 0 12px;
      background: transparent;
      color: var(--text-color);
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 18px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.4s ease;
    }

    #attach-btn:hover {
      background: rgba(128, 128, 128, 0.15);
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 14px;
      color: var(--text-color);
      outline: none;
    }

    #send-btn {
      margin-left: 8px;
      padding: 10px 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s ease;
    }

    #save-btn {
      margin-left: 6px;
      padding: 10px 14px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    #save-btn:hover {
      background: #218838;
    }

    /* Loading Spinner Animation */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.15);
      border-top-color: #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Flowing background entrance animation for message elements */
    @keyframes flowIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .flow-block {
      animation: flowIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    /* Theme Variables */
    :root {
      --bg-color: #f4f4f9;
      --chat-bg: #ffffff;
      --text-color: #333333;
      --bot-bg: #e9ecef;
      --bot-text: #333333;
      --user-bg: #007bff;
      --user-text: #ffffff;
      --input-bg: #ffffff;
      --input-border: #cccccc;
      --border-color: #cccccc;
    }

    [data-theme="dark"] {
      --bg-color: #1e1e1e;
      --chat-bg: #2c2c2c;
      --text-color: #f4f4f4;
      --bot-bg: #3a3a3a;
      --bot-text: #f4f4f4;
      --user-bg: #0056b3;
      --user-text: #ffffff;
      --input-bg: #2c2c2c;
      --input-border: #555555;
      --border-color: #555555;
    }

    #header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      font-size: 15px;
      position: relative;
      z-index: 10;
    }

    .theme-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #007bff;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .theme-label-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    .theme-text {
      position: relative;
      width: 105px;
      text-align: right;
      transition: opacity 0.3s ease, transform 0.3s ease;
      display: inline-block;
    }

    /* Slide-up pop-up animation for file badge */
    @keyframes badgeSlideUp {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #file-badge-container {
      padding: 0 12px 6px 12px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .file-preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 123, 255, 0.15);
      color: var(--text-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border-color);
      animation: badgeSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .file-preview-badge button {
      background: none;
      border: none;
      color: var(--text-color);
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      padding: 0;
      line-height: 1;
    }

    .file-preview-badge button:hover {
      color: #ff4d4d;
    }

    /* Particle Dispersal Animation Styles */
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx), var(--ty)) scale(0.3) rotate(var(--trot));
      }
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #007bff;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFloat 0.5s ease-out forwards;
      z-index: 999;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      color: #aaa;
      padding: 4px 10px;
      font-size: 11px;
      font-family: monospace;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    .copy-code-btn {
      background: transparent;
      border: 1px solid #555;
      color: #ccc;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-code-btn:hover {
      background: #333;
      color: #fff;
    }

    /* Modal Styles Fixed */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 9999;
    }

    .modal-overlay.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--chat-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 18px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transform: translateY(-10px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.visible .modal-content {
      transform: translateY(0);
    }

    #modal-prompt-input {
      width: 100%;
      padding: 8px;
      background: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--input-border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }

  </style>
</head>
<body>

<div id="chat-container">
  <div id="header-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span>AI Chat</span>
      <button onclick="openPromptModal()" style="background: none; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer;" title="Customize AI Persona">⚙️ Prompt</button>
      <button onclick="clearChat()" style="background: none; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer;" title="Clear Chat History">🗑️ Clear</button>
      <button onclick="openStatsModal()" style="background: none; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 4px; padding: 2px 8px; font-size: 12px; cursor: pointer;" title="Chat Statistics">📊 Stats</button>
    </div>
    <div class="theme-label-container">
      <span id="theme-label" class="theme-text">☀️ Light Mode</span>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <div id="messages">
    <div class="msg bot flow-block">Hello! Ask me anything!</div>
  </div>
  
  <button id="scroll-bottom-btn" onclick="scrollToBottom()" title="Scroll to bottom">⬇️</button>

  <div id="file-badge-container"></div>

  <div id="input-area">
    <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)" />
    
    <div id="input-wrapper">
      <button id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach File">+</button>
      <input type="text" id="user-input" placeholder="Type a message or attach a file..." />
    </div>

    <button id="send-btn" onclick="sendMessage()">Send</button>
    <button id="save-btn" onclick="saveChatHistory()" title="Save Chat History">💾 Save</button>
  </div>

  <!-- Custom System Prompt Modal -->
  <div id="prompt-modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 16px;">Customize System Prompt</h3>
      <p style="font-size: 12px; color: #888; margin-top: 0; margin-bottom: 12px;">Define how the AI behaves, speaks, or formats its answers.</p>
      <textarea id="modal-prompt-input" rows="5" placeholder="e.g., You are a friendly math tutor. Explain concepts step-by-step using simple analogies..."></textarea>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
        <button onclick="resetSystemPrompt()" style="background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;" title="Revert to default prompt">Reset Default</button>
        <div style="display: flex; gap: 8px;">
          <button onclick="closePromptModal()" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 4px; cursor: pointer;">Cancel</button>
          <button onclick="saveSystemPrompt()" style="background: #007bff; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">Save Prompt</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Chat Statistics Modal -->
  <div id="stats-modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <h3 style="margin-top: 0; margin-bottom: 8px; font-size: 16px;">Chat Statistics</h3>
      <p style="font-size: 12px; color: #888; margin-top: 0; margin-bottom: 12px;">Live metrics for your current conversation session.</p>
      
      <div style="font-size: 13px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
        <div><strong>Total Messages:</strong> <span id="stat-msg-count">0</span></div>
        <div><strong>User / AI Turns:</strong> <span id="stat-turns">0 user / 0 AI</span></div>
        <div><strong>Total Characters:</strong> <span id="stat-chars">0</span></div>
        <div><strong>Estimated Tokens:</strong> <span id="stat-tokens">0</span></div>
      </div>

      <div style="display: flex; justify-content: flex-end;">
        <button onclick="closeStatsModal()" style="background: #007bff; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: bold;">Close</button>
      </div>
    </div>
  </div>
  
</div>

<script>
  // Configuration constants
  const SCRIPT_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE";
  const DEFAULT_SYSTEM_PROMPT = "You are a helpful, knowledgeable, and friendly assistant. Always structure your responses using rich Markdown formatting: use bold headers (###), bullet points, markdown tables for lists/timelines, and horizontal rules (---) to separate sections. When writing mathematical expressions or fractions, always use single dollar signs for inline math (e.g. $\\frac{a}{b}$) and double dollar signs for block math (e.g. $$\\frac{a}{b}$$).";

  const messagesContainer = document.getElementById('messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const scrollBtn = document.getElementById('scroll-bottom-btn');

  let attachedFileContent = null;
  let attachedFileName = null;

  let abortController = null;
  let activeLoadingDiv = null;
  let isGenerating = false;
  let timeoutIDs = [];

  function setGeneratingState(generating) {
    isGenerating = generating;
    if (generating) {
      sendBtn.textContent = "Stop";
      sendBtn.style.backgroundColor = "#fd7e14";
      sendBtn.onclick = stopGeneration;
    } else {
      sendBtn.textContent = "Send";
      sendBtn.style.backgroundColor = "#007bff";
      sendBtn.onclick = sendMessage;
    }
    userInput.disabled = generating;
  }

  function stopGeneration() {
    if (abortController) {
      abortController.abort();
      abortController = null;
    }
    timeoutIDs.forEach(id => clearTimeout(id));
    timeoutIDs = [];

    if (activeLoadingDiv) {
      let currentHTML = activeLoadingDiv.innerHTML;
      if (currentHTML.includes('<span class="spinner"></span>')) {
        activeLoadingDiv.innerHTML = '<em>(Generation stopped by user)</em>';
      } else {
        activeLoadingDiv.innerHTML += '<br><em>(The user stopped the output)</em>';
      }
      conversationHistory.push({ role: "assistant", content: activeLoadingDiv.innerText });
      activeLoadingDiv = null;
    }  

    setGeneratingState(false);
    userInput.disabled = false;
    userInput.focus();
  }

  const conversationHistory = [
    { 
      role: "system", 
      content: DEFAULT_SYSTEM_PROMPT 
    }
  ];

  function parseMessageWithMath(text) {
    if (!text) return '';
    
    let normalized = text
      .replace(/\\\s*\[([\s\S]*?)\\\s*\]/g, (match, p1) => `\n\n$$${p1.trim()}$$\n\n`)
      .replace(/\\\s*\(([\s\S]*?)\\\s*\)/g, (match, p1) => `$${p1.trim()}$`);

    const mathBlocks = [];
    let protectedText = normalized.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
      mathBlocks.push(match);
      return `@@MATH_${mathBlocks.length - 1}@@`;
    });

    let parsedHTML = typeof marked !== 'undefined' ? marked.parse(protectedText) : protectedText;

    mathBlocks.forEach((math, index) => {
      let isDisplay = math.startsWith('$$');
      let latexContent = math.slice(isDisplay ? 2 : 1, isDisplay ? -2 : -1).trim();
      
      let renderedMath = math;
      if (typeof katex !== 'undefined') {
        try {
          renderedMath = katex.renderToString(latexContent, {
            displayMode: isDisplay,
            throwOnError: false
          });
        } catch (e) {
          console.error("KaTeX rendering error:", e);
        }
      }
      
      parsedHTML = parsedHTML.replace(`@@MATH_${index}@@`, renderedMath);
    });

    return parsedHTML;
  }

  function flowInEffect(element, htmlContent) {
    element.innerHTML = "";
    
    const rawParagraphs = htmlContent.split(/\n\n+/).filter(p => p.trim() !== '');
    
    if (rawParagraphs.length === 0) {
      element.innerHTML = parseMessageWithMath(htmlContent);
      setGeneratingState(false);
      userInput.disabled = false;
      userInput.focus();
      return;
    }

    rawParagraphs.forEach((paraText, index) => {
      let tid = setTimeout(() => {
        if (!isGenerating && element !== activeLoadingDiv) return;

        const parsedParaHTML = parseMessageWithMath(paraText);
        const blockDiv = document.createElement('div');
        blockDiv.className = 'flow-block';
        blockDiv.innerHTML = parsedParaHTML;
        blockDiv.style.marginBottom = '8px';
        
        element.appendChild(blockDiv);
        attachCopyButtons(blockDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        if (index === rawParagraphs.length - 1) {
          setGeneratingState(false);
          conversationHistory.push({ role: "assistant", content: htmlContent });
          activeLoadingDiv = null;
          userInput.disabled = false;
          userInput.focus();
        }
      }, index * 90);
      timeoutIDs.push(tid);
    });
  }

  function updateThemeUI(isDark, animate = true) {
    const label = document.getElementById('theme-label');
    
    if (animate) {
      label.style.opacity = '0';
      label.style.transform = 'translateY(-4px)';
    }

    setTimeout(() => {
      label.textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
      if (animate) {
        label.style.opacity = '1';
        label.style.transform = 'translateY(0)';
      }
    }, animate ? 150 : 0);
  }

  function toggleTheme() {
    const isDark = document.getElementById('theme-toggle').checked;
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');
    }
    updateThemeUI(isDark, true);
  }

  function saveChatHistory() {
    const chatLog = conversationHistory
      .filter(msg => msg.role !== 'system')
      .map(msg => `${msg.role === 'user' ? 'You' : 'AI'}: ${msg.content}`)
      .join('\n\n------------------------------------\n\n');

    if (!chatLog) {
      alert("No chat history to save yet!");
      return;
    }

    const blob = new Blob([chatLog], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    
    link.href = url;
    link.download = `chat-history-${new Date().toISOString().slice(0, 10)}.txt`;
    document.body.appendChild(link);
    link.click();
    
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('theme-toggle').checked = true;
      updateThemeUI(true, false);
    } else {
      updateThemeUI(false, false);
    }

    const savedPrompt = localStorage.getItem('customSystemPrompt');
    if (savedPrompt) {
      conversationHistory[0].content = savedPrompt;
    }
  });

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      const link = document.createElement('a');
      link.href = 'https://classroom.google.com';
      link.target = '_top';
      document.body.appendChild(link);
      link.click();
      
      setTimeout(function() {
        window.location.href = 'https://classroom.google.com';
      }, 100);
    }
  });

  userInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      attachedFileContent = e.target.result;
      attachedFileName = file.name;
      
      const badgeContainer = document.getElementById('file-badge-container');
      badgeContainer.innerHTML = `
        <div class="file-preview-badge">
          <span>📎 ${file.name}</span>
          <button onclick="removeAttachedFile()" title="Remove file">&times;</button>
        </div>
      `;
      userInput.focus();
    };
    reader.readAsText(file);
  }

  function removeAttachedFile() {
    const badgeElement = document.querySelector('.file-preview-badge');

    if (badgeElement) {
      const rect = badgeElement.getBoundingClientRect();

      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        const tx = (Math.random() - 0.5) * 100;
        const ty = -Math.random() * 60 - 20;
        const trot = (Math.random() - 0.5) * 360;

        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);
        particle.style.setProperty('--trot', `${trot}deg`);

        particle.style.left = `${rect.left + rect.width / 2}px`;
        particle.style.top = `${rect.top + rect.height / 2}px`;

        document.body.appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 500);
      }
    }

    attachedFileContent = null;
    attachedFileName = null;
    document.getElementById('file-input').value = '';
    document.getElementById('file-badge-container').innerHTML = '';
    userInput.focus();
  }

  async function sendMessage() {
    let text = userInput.value.trim();

    if (attachedFileContent && attachedFileName) {
      text = `${text ? text + '\n\n' : ''}[Attached File: ${attachedFileName}]\n\`\`\`\n${attachedFileContent}\n\`\`\``;
    }

    if (!text) return;

    const displayMessage = userInput.value.trim() + (attachedFileName ? ` (Attached: ${attachedFileName})` : '');
    addMessage(displayMessage, 'user');
    
    conversationHistory.push({ role: "user", content: text });

    attachedFileContent = null;
    attachedFileName = null;
    document.getElementById('file-input').value = '';
    document.getElementById('file-badge-container').innerHTML = '';

    userInput.value = '';
    userInput.disabled = true;

    setGeneratingState(true);
    activeLoadingDiv = addMessage('<span class="spinner"></span>Thinking...', 'bot');
    abortController = new AbortController();

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          messages: conversationHistory
        }),
        signal: abortController.signal
      });

      const data = await response.json();
      
      if (data.choices && data.choices.length > 0) {
        const botReply = data.choices[0].message.content;
        flowInEffect(activeLoadingDiv, botReply);
      } else {
        activeLoadingDiv.textContent = "Error: Invalid response, try again later.";
        conversationHistory.pop();
        setGeneratingState(false);
        userInput.disabled = false;
        userInput.focus();
      }
    } catch (error) {
      if (error.name === 'AbortError') {
        console.log("Fetch aborted by user.");
      } else {
        console.error(error);
        if (activeLoadingDiv) {
          activeLoadingDiv.textContent = "Error connecting, try again later.";
        }
        conversationHistory.pop();
        setGeneratingState(false);
        userInput.disabled = false;
        userInput.focus();
      }
    }
  }

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('msg', sender, 'flow-block');
    
    if (sender === 'bot') {
      msgDiv.innerHTML = parseMessageWithMath(text);
    } else {
      msgDiv.textContent = text;
    }

    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return msgDiv;
  }

  function attachCopyButtons(container) {
    const codeBlocks = container.querySelectorAll('pre');
    codeBlocks.forEach((pre) => {
      if (pre.querySelector('.code-header')) return;

      const header = document.createElement('div');
      header.className = 'code-header';
      header.innerHTML = `
        <span>code</span>
        <button class="copy-code-btn" onclick="copyCodeText(this)">Copy</button>
      `;
      pre.insertBefore(header, pre.firstChild);
    });
  }

  function copyCodeText(button) {
    const pre = button.closest('pre');
    const code = pre.querySelector('code');
    const textToCopy = code ? code.innerText : pre.innerText;
    
    navigator.clipboard.writeText(textToCopy).then(() => {
      button.textContent = 'Copied!';
      setTimeout(() => {
        button.textContent = 'Copy';
      }, 1500);
    });
  }

  messagesContainer.addEventListener('scroll', () => {
    const distanceToBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
    if (distanceToBottom > 150) {
      scrollBtn.classList.add('visible');
    } else {
      scrollBtn.classList.remove('visible');
    }
  });

  function scrollToBottom() {
    messagesContainer.scrollTo({
      top: messagesContainer.scrollHeight,
      behavior: 'smooth'
    });
  }

  const modalOverlay = document.getElementById('prompt-modal-overlay');
  const modalPromptInput = document.getElementById('modal-prompt-input');

  function openPromptModal() {
    modalPromptInput.value = conversationHistory[0].content;
    modalOverlay.classList.add('visible');
    setTimeout(() => modalPromptInput.focus(), 100);
  }

  function closePromptModal() {
    modalOverlay.classList.remove('visible');
  }

  function saveSystemPrompt() {
    const customPrompt = modalPromptInput.value.trim();
    if (!customPrompt) {
      alert("System prompt cannot be empty!");
      return;
    }

    conversationHistory[0].content = customPrompt;
    localStorage.setItem('customSystemPrompt', customPrompt);

    closePromptModal();
    addMessage("🤖 System prompt updated!", "bot");
  }

  const statsModalOverlay = document.getElementById('stats-modal-overlay');

  function openStatsModal() {
    const chatMsgs = conversationHistory.filter(m => m.role !== 'system');
    const totalMsgs = chatMsgs.length;
    const userMsgs = chatMsgs.filter(m => m.role === 'user').length;
    const botMsgs = chatMsgs.filter(m => m.role === 'assistant').length;

    let totalChars = 0;
    chatMsgs.forEach(m => {
      totalChars += m.content.length;
    });

    const estimatedTokens = Math.ceil(totalChars / 4);

    document.getElementById('stat-msg-count').textContent = totalMsgs;
    document.getElementById('stat-turns').textContent = `${userMsgs} user / ${botMsgs} AI`;
    document.getElementById('stat-chars').textContent = totalChars.toLocaleString();
    document.getElementById('stat-tokens').textContent = estimatedTokens.toLocaleString();

    statsModalOverlay.classList.add('visible');
  }

  function closeStatsModal() {
    statsModalOverlay.classList.remove('visible');
  }

  function clearChat() {
    if (isGenerating) {
      stopGeneration();
    }

    const systemPrompt = conversationHistory[0];
    conversationHistory.length = 0;
    conversationHistory.push(systemPrompt);

    messagesContainer.innerHTML = '<div class="msg bot flow-block">Hello! Ask me anything!</div>';

    if (attachedFileName) {
      removeAttachedFile();
    }

    userInput.focus();
  }

  function resetSystemPrompt() {
    modalPromptInput.value = DEFAULT_SYSTEM_PROMPT;
    conversationHistory[0].content = DEFAULT_SYSTEM_PROMPT;
    localStorage.removeItem('customSystemPrompt');
    closePromptModal();
    addMessage("🔄 System prompt reset to default!", "bot");
  }
</script>

</body>
</html>
