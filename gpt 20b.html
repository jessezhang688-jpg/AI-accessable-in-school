<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 1. Include Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- 2. Include KaTeX CSS and JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  
  <!-- 3. Include KaTeX Auto-Render Extension -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* Smooth transition animation for theme switching */
    body, #chat-container, #header-bar, #input-area, #user-input, .msg {
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    /* Force body and html to fill the entire embedded frame without scrollbars */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
    }

    *, *:before, *:after {
      box-sizing: inherit;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      background: var(--chat-bg);
    }

    #messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Markdown Styling Inside Chat Bubbles */
    .msg p {
      margin: 0 0 8px 0;
    }
    .msg p:last-child {
      margin-bottom: 0;
    }
    .msg pre {
      background: #272822;
      color: #f8f8f2;
      padding: 8px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
    .msg code {
      font-family: monospace;
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 4px;
      border-radius: 4px;
    }
    .msg ul, .msg ol {
      margin: 4px 0;
      padding-left: 20px;
    }
    .msg table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
    }
    .msg th, .msg td {
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      font-size: 13px;
    }
    .msg th {
      background: rgba(0, 0, 0, 0.05);
    }

    .user {
      align-self: flex-end;
      background: var(--user-bg);
      color: var(--user-text);
    }

    .bot {
      align-self: flex-start;
      background: var(--bot-bg);
      color: var(--bot-text);
    }

    #input-area {
      display: flex;
      border-top: 1px solid var(--border-color);
      padding: 8px;
      background: var(--chat-bg);
    }

    #user-input {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text-color);
    }

    #send-btn {
      margin-left: 8px;
      padding: 10px 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    #send-btn:disabled {
      background: #ccc;
    }

    /* Loading Spinner Animation */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.15);
      border-top-color: #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      animation: messageSlideIn 0.3s ease-out forwards;
    }

    /* Theme Variables */
    :root {
      --bg-color: #f4f4f9;
      --chat-bg: #ffffff;
      --text-color: #333333;
      --bot-bg: #e9ecef;
      --bot-text: #333333;
      --user-bg: #007bff;
      --user-text: #ffffff;
      --input-bg: #ffffff;
      --input-border: #cccccc;
      --border-color: #cccccc;
    }

    [data-theme="dark"] {
      --bg-color: #1e1e1e;
      --chat-bg: #2c2c2c;
      --text-color: #f4f4f4;
      --bot-bg: #3a3a3a;
      --bot-text: #f4f4f4;
      --user-bg: #0056b3;
      --user-text: #ffffff;
      --input-bg: #2c2c2c;
      --input-border: #555555;
      --border-color: #555555;
    }

    #header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      font-weight: bold;
      font-size: 15px;
    }

    .theme-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #007bff;
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .theme-label-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    .theme-text {
      position: relative;
      width: 80px;
      text-align: right;
      transition: opacity 0.3s ease, transform 0.3s ease;
      display: inline-block;
    }

    #save-btn {
      margin-left: 6px;
      padding: 10px 18px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    #save-btn:hover {
      background: #218838;
    }
  </style>
</head>
<body>

<div id="chat-container">
  <div id="header-bar">
    <span>AI Chat</span>
    <div class="theme-label-container">
      <span id="theme-label" class="theme-text">Light Mode</span>
      <label class="theme-switch">
        <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <div id="messages">
    <div class="msg bot">Hello! Ask me anything!</div>
  </div>
  <div id="input-area">
    <input type="text" id="user-input" placeholder="Type a message..." />
    <button id="send-btn" onclick="sendMessage()">Send</button>
    <button id="save-btn" onclick="saveChatHistory()">Save Chat</button>
  </div>
</div>

<script>
  const messagesContainer = document.getElementById('messages');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  const conversationHistory = [
    { role: "system", content: "You are a helpful, knowledgeable, and friendly assistant. Always structure your responses using rich Markdown formatting: use bold headers (###), bullet points, markdown tables for lists/timelines, and horizontal rules (---) to separate sections. When writing mathematical expressions or fractions, always use single dollar signs for inline math (e.g. $\\frac{a}{b}$) and double dollar signs for block math." }
  ];

  function parseMessageWithMath(text) {
    const mathBlocks = [];
    let protectedText = text.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
      mathBlocks.push(match);
      return `@@MATH_${mathBlocks.length - 1}@@`;
    });

    let parsedHTML = typeof marked !== 'undefined' ? marked.parse(protectedText) : protectedText;

    mathBlocks.forEach((math, index) => {
      parsedHTML = parsedHTML.replace(`@@MATH_${index}@@`, math);
    });

    return parsedHTML;
  }

  function typeWriterEffect(element, htmlContent, speed = 3) {
    element.innerHTML = "";
    
    const finalHTML = parseMessageWithMath(htmlContent);
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = finalHTML;
    const fullText = tempDiv.textContent;
    
    let charIndex = 0;
    const textSpan = document.createElement('span');
    element.appendChild(textSpan);
    
    let timer = setInterval(() => {
      if (charIndex < fullText.length) {
        textSpan.textContent += fullText.charAt(charIndex);
        charIndex++;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      } else {
        clearInterval(timer);
        element.innerHTML = finalHTML;
        
        if (typeof renderMathInElement !== 'undefined') {
          renderMathInElement(element, {
            delimiters: [
              {left: "$$", right: "$$", display: true},
              {left: "$", right: "$", display: false}
            ],
            throwOnError: false
          });
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }
    }, speed);
  }

  function updateThemeUI(isDark, animate = true) {
    const label = document.getElementById('theme-label');
    
    if (animate) {
      label.style.opacity = '0';
      label.style.transform = 'translateY(-4px)';
    }

    setTimeout(() => {
      label.textContent = isDark ? 'Dark Mode' : 'Light Mode';
      if (animate) {
        label.style.opacity = '1';
        label.style.transform = 'translateY(0)';
      }
    }, animate ? 150 : 0);
  }

  function toggleTheme() {
    const isDark = document.getElementById('theme-toggle').checked;
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');
    }
    updateThemeUI(isDark, true);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('theme-toggle').checked = true;
      updateThemeUI(true, false);
    } else {
      updateThemeUI(false, false);
    }
  });

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      const link = document.createElement('a');
      link.href = 'https://classroom.google.com';
      link.target = '_top';
      document.body.appendChild(link);
      link.click();
      
      setTimeout(function() {
        window.location.href = 'https://classroom.google.com';
      }, 100);
    }
  });

  userInput.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    conversationHistory.push({ role: "user", content: text });

    userInput.value = '';
    userInput.disabled = true;
    sendBtn.disabled = true;

    const loadingDiv = addMessage('<span class="spinner"></span>Thinking...', 'bot');

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbwD8gl-qLpvmU5Y_FPPRlgTaIKGX5PEyLY-veIlM__ceGFKeJF3aGQsFOuiExA5gA/exec", {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({
          messages: conversationHistory
        })
      });

      const data = await response.json();
      
      if (data.choices && data.choices.length > 0) {
        const botReply = data.choices[0].message.content;
        typeWriterEffect(loadingDiv, botReply, 3);
        conversationHistory.push({ role: "assistant", content: botReply });
      } else {
        loadingDiv.textContent = "Error: Invalid response, try again later.";
        conversationHistory.pop();
      }
    } catch (error) {
      console.error(error);
      loadingDiv.textContent = "Error connecting, try again later.";
      conversationHistory.pop();
    } finally {
      userInput.disabled = false;
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('msg', sender);
    
    if (sender === 'bot') {
      msgDiv.innerHTML = parseMessageWithMath(text);
      if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(msgDiv, {
          delimiters: [
            {left: "$$", right: "$$", display: true},
            {left: "$", right: "$", display: false}
          ],
          throwOnError: false
        });
      }
    } else {
      msgDiv.textContent = text;
    }

    messagesContainer.appendChild(msgDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    return msgDiv;
  }

  function saveChatHistory(){
    const chatLog = conversationHistory.filter(msg => `${msg.role === 'user' ? 'You: ' : 'AI: '} ${msg.content}`).join('\n\n------------------------------------\n\n');
    if(!chatLog) {
      alert("No chat history to save.");
      return;
    }

    const blob = new Blob([chatLog], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `chat-history-${new Date().toISOString().slice(0, 10)}.txt`;
    document.body.appendChild(link);
    link.click();

    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
